manifest_version: "2.0.0"
created_date: "2026-07-21"
description: >-
  Expanded balanced PubMed and Europe PMC discovery for four liver cell types

revision:
  previous_version: "1.0.0"
  reason: >-
    Version 1 produced sparse results for one or more target cell types.
    Version 2 adds controlled LNP and cell-name synonyms to improve recall
    without removing the target-cell requirement.
  changes:
    - "Added ionizable lipid nanoparticle terminology"
    - "Added nucleic acid lipid particle and SNALP terminology"
    - "Added lipid-based and lipid-like nanoparticle terminology"
    - "Added selected cell-name synonyms"
    - "Qualified ambiguous HSC abbreviations with a liver term"

retrieval_policy:
  retrieval_cap_per_cell_per_source: 100
  pubmed_page_size: 100
  europe_pmc_page_size: 100
  discovery_sources:
    - pubmed
    - europe_pmc
  full_text_is_not_a_discovery_source: true

cell_types:
  hepatocyte:
    display_name: "Hepatocyte"
    aliases:
      - "hepatocyte"
      - "hepatocytes"
      - "hepatic parenchymal cell"
      - "hepatic parenchymal cells"
      - "liver parenchymal cell"
      - "liver parenchymal cells"

  kupffer:
    display_name: "Kupffer cell"
    aliases:
      - "Kupffer cell"
      - "Kupffer cells"
      - "Kupffer macrophage"
      - "Kupffer macrophages"
      - "liver macrophage"
      - "liver macrophages"
      - "hepatic macrophage"
      - "hepatic macrophages"
      - "liver resident macrophage"
      - "liver resident macrophages"

  lsec:
    display_name: "Liver sinusoidal endothelial cell"
    aliases:
      - "liver sinusoidal endothelial cell"
      - "liver sinusoidal endothelial cells"
      - "hepatic sinusoidal endothelial cell"
      - "hepatic sinusoidal endothelial cells"
      - "sinusoidal endothelial cell"
      - "sinusoidal endothelial cells"
      - "liver endothelial cell"
      - "liver endothelial cells"
      - "hepatic endothelial cell"
      - "hepatic endothelial cells"
      - "LSEC"
      - "LSECs"

  hsc:
    display_name: "Hepatic stellate cell"
    aliases:
      - "hepatic stellate cell"
      - "hepatic stellate cells"
      - "liver stellate cell"
      - "liver stellate cells"
      - "Ito cell"
      - "Ito cells"
      - "perisinusoidal cell"
      - "perisinusoidal cells"
      - "fat-storing cell"
      - "fat-storing cells"
      - "HSC with liver context"
      - "HSCs with liver context"

