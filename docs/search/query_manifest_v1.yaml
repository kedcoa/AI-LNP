manifest_version: "1.0.0"
created_date: "2026-07-21"
description: >-
  Balanced PubMed and Europe PMC discovery for four liver cell types

retrieval_policy:
  retrieval_cap_per_cell_per_source: 100
  pubmed_page_size: 100
  europe_pmc_page_size: 100
  discovery_sources:
    - pubmed
    - europe_pmc
  full_text_is_not_a_discovery_source: true

cell_types:
  hepatocyte:
    display_name: "Hepatocyte"
    aliases:
      - "hepatocyte"
      - "hepatocytes"
      - "hepatic parenchymal cell"
      - "hepatic parenchymal cells"

  kupffer:
    display_name: "Kupffer cell"
    aliases:
      - "Kupffer cell"
      - "Kupffer cells"
      - "liver macrophage"
      - "liver macrophages"

  lsec:
    display_name: "Liver sinusoidal endothelial cell"
    aliases:
      - "liver sinusoidal endothelial cell"
      - "liver sinusoidal endothelial cells"
      - "hepatic sinusoidal endothelial cell"
      - "hepatic sinusoidal endothelial cells"
      - "LSEC"
      - "LSECs"

  hsc:
    display_name: "Hepatic stellate cell"
    aliases:
      - "hepatic stellate cell"
      - "hepatic stellate cells"
      - "liver stellate cell"
      - "liver stellate cells"
      - "Ito cell"
      - "Ito cells"
      - "HSC"
      - "HSCs"

queries:
  pubmed:
    hepatocyte: >-
      ("lipid nanoparticle"[Title/Abstract]
      OR "lipid nanoparticles"[Title/Abstract]
      OR LNP[Title/Abstract]
      OR LNPs[Title/Abstract])
      AND
      (hepatocyte[Title/Abstract]
      OR hepatocytes[Title/Abstract]
      OR "hepatic parenchymal cell"[Title/Abstract]
      OR "hepatic parenchymal cells"[Title/Abstract])

    kupffer: >-
      ("lipid nanoparticle"[Title/Abstract]
      OR "lipid nanoparticles"[Title/Abstract]
      OR LNP[Title/Abstract]
      OR LNPs[Title/Abstract])
      AND
      ("Kupffer cell"[Title/Abstract]
      OR "Kupffer cells"[Title/Abstract]
      OR "liver macrophage"[Title/Abstract]
      OR "liver macrophages"[Title/Abstract])

    lsec: >-
      ("lipid nanoparticle"[Title/Abstract]
      OR "lipid nanoparticles"[Title/Abstract]
      OR LNP[Title/Abstract]
      OR LNPs[Title/Abstract])
      AND
      ("liver sinusoidal endothelial cell"[Title/Abstract]
      OR "liver sinusoidal endothelial cells"[Title/Abstract]
      OR "hepatic sinusoidal endothelial cell"[Title/Abstract]
      OR "hepatic sinusoidal endothelial cells"[Title/Abstract]
      OR LSEC[Title/Abstract]
      OR LSECs[Title/Abstract])

    hsc: >-
      ("lipid nanoparticle"[Title/Abstract]
      OR "lipid nanoparticles"[Title/Abstract]
      OR LNP[Title/Abstract]
      OR LNPs[Title/Abstract])
      AND
      ("hepatic stellate cell"[Title/Abstract]
      OR "hepatic stellate cells"[Title/Abstract]
      OR "liver stellate cell"[Title/Abstract]
      OR "liver stellate cells"[Title/Abstract]
      OR "Ito cell"[Title/Abstract]
      OR "Ito cells"[Title/Abstract]
      OR HSC[Title/Abstract]
      OR HSCs[Title/Abstract])

  europe_pmc:
    hepatocyte: >-
      (TITLE_ABS:"lipid nanoparticle"
      OR TITLE_ABS:"lipid nanoparticles"
      OR TITLE_ABS:LNP
      OR TITLE_ABS:LNPs)
      AND
      (TITLE_ABS:hepatocyte
      OR TITLE_ABS:hepatocytes
      OR TITLE_ABS:"hepatic parenchymal cell"
      OR TITLE_ABS:"hepatic parenchymal cells")

    kupffer: >-
      (TITLE_ABS:"lipid nanoparticle"
      OR TITLE_ABS:"lipid nanoparticles"
      OR TITLE_ABS:LNP
      OR TITLE_ABS:LNPs)
      AND
      (TITLE_ABS:"Kupffer cell"
      OR TITLE_ABS:"Kupffer cells"
      OR TITLE_ABS:"liver macrophage"
      OR TITLE_ABS:"liver macrophages")

    lsec: >-
      (TITLE_ABS:"lipid nanoparticle"
      OR TITLE_ABS:"lipid nanoparticles"
      OR TITLE_ABS:LNP
      OR TITLE_ABS:LNPs)
      AND
      (TITLE_ABS:"liver sinusoidal endothelial cell"
      OR TITLE_ABS:"liver sinusoidal endothelial cells"
      OR TITLE_ABS:"hepatic sinusoidal endothelial cell"
      OR TITLE_ABS:"hepatic sinusoidal endothelial cells"
      OR TITLE_ABS:LSEC
      OR TITLE_ABS:LSECs)

    hsc: >-
      (TITLE_ABS:"lipid nanoparticle"
      OR TITLE_ABS:"lipid nanoparticles"
      OR TITLE_ABS:LNP
      OR TITLE_ABS:LNPs)
      AND
      (TITLE_ABS:"hepatic stellate cell"
      OR TITLE_ABS:"hepatic stellate cells"
      OR TITLE_ABS:"liver stellate cell"
      OR TITLE_ABS:"liver stellate cells"
      OR TITLE_ABS:"Ito cell"
      OR TITLE_ABS:"Ito cells"
      OR TITLE_ABS:HSC
      OR TITLE_ABS:HSCs)